blueprint:
  name: bp_modo_aula v1.0
  description: Cambia el estado a 'apagado' y 'auto' según dos horarios, filtrando solo los selectores que contengan la palabra 'modo'.
  domain: automation
  input:
    target_entities:
      name: Aulas / Selectores a controlar
      description: Selecciona las entidades (input_select) o áreas. Se filtrarán automáticamente solo las que incluyan 'modo' en su nombre.
      selector:
        target:
          entity:
            domain: input_select

    time_turn_off:
      name: Hora de Apagado
      description: Hora a la que el modo cambiará a 'apagado'.
      default: "06:00:00"
      selector:
        time: {}

    time_turn_auto:
      name: Hora de Modo Auto
      description: Hora a la que el modo cambiará a 'auto'.
      default: "15:00:00"
      selector:
        time: {}

mode: single

triggers:
  - trigger: time
    at: !input time_turn_off
    id: trigger_apagado
    weekday:
      - mon
      - tue
      - wed
      - thu
      - fri

  - trigger: time
    at: !input time_turn_auto
    id: trigger_auto
    weekday:
      - mon
      - tue
      - wed
      - thu
      - fri

actions:
  - variables:
      # Convierte el input de destinos en una lista de entity_ids filtrados que contengan la palabra 'modo'
      raw_targets: !input target_entities
      filtered_entities: >
        {% set targets = raw_targets.get('entity_id', []) %}
        {% if targets is string %}
          {% set targets = [targets] %}
        {% endif %}
        {% set ns = namespace(entities=[]) %}
        {% for entity in targets %}
          {% set name = state_attr(entity, 'friendly_name') | default('', true) %}
          {% if 'modo' in entity.lower() or 'modo' in name.lower() %}
            {% set ns.entities = ns.entities + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.entities }}

  # Solo ejecuta las acciones si se encontró al menos una entidad con la palabra 'modo'
  - condition: template
    value_template: "{{ filtered_entities | length > 0 }}"

  - choose:
      - conditions:
          - condition: trigger
            id:
              - trigger_apagado
        sequence:
          - action: input_select.select_option
            data:
              option: "apagado"
            target:
              entity_id: "{{ filtered_entities }}"

      - conditions:
          - condition: trigger
            id:
              - trigger_auto
        sequence:
          - action: input_select.select_option
            data:
              option: "auto"
            target:
              entity_id: "{{ filtered_entities }}"